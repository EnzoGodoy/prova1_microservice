server.port=8080

spring.datasource.url=jdbc:h2:mem:playyourlist
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# URL base usada pelos clientes OpenFeign do modulo "api" para chamar
# os demais "microservicos" (musicas, playlists, reproducao), que rodam
# dentro desta mesma aplicacao, na mesma porta
app.self-url=http://localhost:${server.port}
